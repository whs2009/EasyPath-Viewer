name: Build and test General edition
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [VERSION]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2022, target: windows-x64}
          - {runner: ubuntu-24.04, target: ubuntu-x64}
          - {runner: ubuntu-24.04-arm, target: ubuntu-arm64}
          - {runner: macos-15, target: macos-arm64}
          - {runner: macos-15-intel, target: macos-x64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      EXPECTED_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++ cmake libx11-dev libxext-dev libxft-dev libxrender-dev libxfixes-dev libxcursor-dev libxinerama-dev libfontconfig1-dev libpng-dev libjpeg-dev zlib1g-dev squashfs-tools xvfb xauth
      - run: python -m pip install --only-binary=:all: -r tools/slide_viewer/requirements-build.txt
      - if: runner.os == 'Linux'
        run: xvfb-run -a python packaging/build.py
      - if: runner.os != 'Linux'
        run: python packaging/build.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: general-${{ matrix.target }}
          path: verified/
          if-no-files-found: error
          compression-level: 0
  release:
    needs: native
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish exactly five verified packages and their SHA-256 sums
        shell: bash
        run: |
          set -euo pipefail
          TAG=$(gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$GITHUB_SHA")
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-general\.[0-9]+$ ]]
          mkdir downloads
          cd downloads
          files=()
          for target in windows-x64 ubuntu-x64 ubuntu-arm64 macos-x64 macos-arm64; do
            case "$target" in windows-*) ext=exe;; ubuntu-*) ext=AppImage;; macos-*) ext=dmg;; esac
            file="EasyPath-Slide-Viewer-$target.$ext"
            gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "general-$target" --dir "$target"
            test "$(find "$target" -mindepth 1 | wc -l)" -eq 1
            test -f "$target/$file" && test ! -L "$target/$file"
            mv "$target/$file" .
            files+=("$file")
          done
          sha256sum "${files[@]}" > SHA256SUMS
          gh release create "$TAG" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "Viewer $TAG (General)" --notes 'Five native General-edition packages tested from this revision. Verify your download against SHA256SUMS. No proprietary scanner SDKs are included.' "${files[@]}" SHA256SUMS
